name: CERCA Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build CERCA
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout source code
        uses: actions/checkout@v4
      
      # -----------------------------
      # Java setup (Azul Zulu + JavaFX)
      # -----------------------------
      - name: Set up Azul Zulu JDK with JavaFX
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: 'jdk+fx'
          cache: 'maven'

      - name: Verify Java installation
        run: java -version

      # -----------------------------
      # Install CERMINE into local Maven repo
      # -----------------------------
      - name: Install CERMINE dependency
        shell: bash
        run: |
          CERMINE_JAR="$(pwd)/lib/cermine.jar"
          echo "Installing CERMINE from $CERMINE_JAR"
          mvn install:install-file \
            -Dfile="$CERMINE_JAR" \
            -DgroupId=pl.edu.icm \
            -DartifactId=cermine \
            -Dversion=1.13 \
            -Dpackaging=jar

      # -----------------------------
      # Build with Maven
      # -----------------------------
      - name: Build CERCA with Maven
        run: mvn clean package

      # -----------------------------
      # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      # -----------------------------
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v5
